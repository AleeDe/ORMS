[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Public values (inlined into the browser bundle by design), not secrets
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL,GOOGLE_CLIENT_ID"

[context.production.environment]
  NEXT_PUBLIC_APP_URL = "https://shiftorms.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"
